[package]
name = "ferrum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native-z3 = ["ferrum-silicon/native-z3"]

[workspace]
members = [".", "crates/ferrum-silver", "crates/ferrum-silicon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"

[workspace.dependencies]
serde_json = "=1.0.145"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
regex = "=1.11.1"
ferrum-silver = { path = "crates/ferrum-silver" }
ferrum-silicon = { path = "crates/ferrum-silicon" }
indexmap = "=2.11.4"
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"

[dependencies]
ferrum-silver.workspace = true
ferrum-silicon.workspace = true

# These recursive verification crates use smaller stack frames with optimization.
[profile.dev.package.ferrum]
opt-level = 1

[profile.dev.package.ferrum-silicon]
opt-level = 1

[profile.dev.package.ferrum-silver]
opt-level = 1
